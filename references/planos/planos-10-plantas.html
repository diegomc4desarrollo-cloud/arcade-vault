<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Zombie — planos de las 10 plantas</title>
<style>
:root{--bg:#0b1a2a;--ink:#dfe9f5;--wall:#7fb3e0;--wallDark:#3c6ea0;--floor:#0f2238;--acid:#9fef22;--red:#ff4d4d;--amber:#ffb454;--muted:#7b93ab}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Oswald','Arial Narrow',sans-serif}
header{padding:22px 24px 8px}h1{margin:0;font-size:26px;letter-spacing:.06em}p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.legend span{display:inline-block;margin-right:14px}.sw{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;padding:18px 24px 40px}
.card{border:1px solid rgba(127,179,224,.35);background:rgba(255,255,255,.02)}
.card h2{margin:0;padding:10px 12px;font-size:15px;font-weight:600;letter-spacing:.08em;border-bottom:1px solid rgba(127,179,224,.25)}
.card h2 span{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
</style></head><body>
<header><h1>PLANOS — 10 PLANTAS</h1>
<p>Vista cenital, 32 x 18 casillas por planta. Se sube de planta cada 3 oleadas.</p>
<p class="legend"><span><i class="sw" style="background:var(--wall)"></i>muro (bloquea jugador, zombis y munición)</span><span><i class="sw" style="background:var(--acid);border-radius:50%"></i>aparición del jugador</span><span><i class="sw" style="background:var(--red);border-radius:50%"></i>entrada de zombis</span><span><i class="sw" style="background:var(--amber)"></i>punto de arma</span></p>
</header>
<div class="grid" id="grid"></div>
<script>
const MAPS = [{"id": 1, "name": "Vestíbulo", "rows": ["################################", "#S......#..............#......S#", "#.......#......W.......#.......#", "#.......#..............#.......#", "#...###..................###...#", "#..............................#", "#..............................#", "#####.......######.......#######", "#...........######.............#", "#.W.........######...........W.#", "#...#.......######.......#.....#", "#####....................#######", "#..............................#", "#..............................#", "#...###.........P........###...#", "#.......#..............#.......#", "#S......#......S.......#......S#", "################################"]}, {"id": 2, "name": "Oficinas", "rows": ["################################", "#S.......#.......#........#...S#", "#........#...W...#........#....#", "#........#.......#........#....#", "#...####...###...####...###....#", "#..............................#", "#.....W.........P..........W...#", "#..............................#", "#...####...###...####...###....#", "#........#.......#........#....#", "#........#.......#........#....#", "#..W.....#.......#....W...#....#", "#........#.......#........#....#", "#...####...###...####...###....#", "#..............................#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 3, "name": "Almacén", "rows": ["################################", "#S............................S#", "#........W.....................#", "#..............................#", "#...########....##########.....#", "#..............................#", "#..............................#", "#......W...............#########", "#.....##########....###......W.#", "#....................#.........#", "#..............P.....#.........#", "#....................#.........#", "#...######....##########.......#", "#..............................#", "#..............................#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 4, "name": "Laboratorio", "rows": ["################################", "#S............................S#", "#...W......................W...#", "#..............................#", "#..##....####......####....##..#", "#........#............#........#", "#........#............#........#", "#........#............#........#", "#..............................#", "#...............P..............#", "#..............................#", "#........#............#........#", "#........#............#........#", "#..##....####......####....##..#", "#..............................#", "#...W......................W...#", "#S.............S..............S#", "################################"]}, {"id": 5, "name": "Parking", "rows": ["################################", "#S............................S#", "#..............................#", "#....##......##......##...######", "#....##......##......##...#...##", "#.........................#.W.##", "#.........................#...##", "#..............................#", "#....##......##......##........#", "#....##......##..P...##........#", "#..............................#", "#..........W...................#", "#........................#######", "#....##......##......##..#######", "#....##......##......##........#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 6, "name": "Cafetería", "rows": ["################################", "#S..........#.................S#", "#...........#...W..............#", "#...........#..................#", "#...........#.....##...........#", "#....#####..#.....##.....##....#", "#..............................#", "#..............................#", "#.....##..........##..........W#", "#.....##.......P..##...........#", "#..............................#", "#...........##..........##.....#", "#...........##..........##.....#", "#..W...##..........##..........#", "#......##..........##..........#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 7, "name": "Salas de reuniones", "rows": ["################################", "#S.........#........#.........S#", "#..........#........#..........#", "#...W......#........#......W...#", "#..........#........#..........#", "#######....#........#....#######", "#..............................#", "#..............................#", "#..............................#", "#............######............#", "#............######............#", "#..............................#", "#...........W..P........W......#", "#######....#........#....#######", "#..........#........#..........#", "#...W......#..S.....#......W...#", "#S.........#........#.........S#", "################################"]}, {"id": 8, "name": "Archivo", "rows": ["################################", "#S............................S#", "#..............................#", "#....#....#....#....#....#.....#", "#....#....#.........#....#.....#", "#....#....#.........#....#.....#", "#....#....#....#....#....#.....#", "#.........#....#....#..........#", "#..W......#....#....#......W...#", "#....#....#.P..#....#....#.....#", "#....#.........#.........#.....#", "#....#.........#.........#.....#", "#....#....#....#....#....#.....#", "#....#....#....#....#....#.....#", "#..............................#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 9, "name": "Sala de servidores", "rows": ["################################", "#S............................S#", "#..............................#", "#..............................#", "#....#############...#######...#", "#....#.........................#", "#....#......W..................#", "#....#.........................#", "#........##################....#", "#.........................#....#", "#..............P..........#....#", "#.........................#....#", "#....#############...######....#", "#..............................#", "#..........W...............W...#", "#..............................#", "#S.............S..............S#", "################################"]}, {"id": 10, "name": "Azotea", "rows": ["################################", "#S..........######............S#", "#...........######.............#", "#...........######.............#", "#..##.......######.......##....#", "#..##....................##....#", "#..............................#", "#..............................#", "#.......###........###.........#", "#...W...###...P....###....W....#", "#.......###........###.........#", "#..............................#", "#..............................#", "#..##....................##....#", "#..##.......######.......##....#", "#...........######.............#", "#S..........######S...........S#", "################################"]}];
const T=20, COLS=32, ROWS=18, W=COLS*T, H=ROWS*T;
const grid=document.getElementById('grid');
MAPS.forEach(m=>{
  const walls=m.rows.join('').split('#').length-1;
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<h2>PLANTA '+m.id+' — '+m.name.toUpperCase()+'<span>'+walls+' casillas de muro</span></h2>';
  const c=document.createElement('canvas');c.width=W;c.height=H;card.appendChild(c);grid.appendChild(card);
  const x=c.getContext('2d');
  x.fillStyle='#0f2238';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(127,179,224,.10)';x.lineWidth=1;
  for(let i=0;i<=COLS;i++){x.beginPath();x.moveTo(i*T+.5,0);x.lineTo(i*T+.5,H);x.stroke();}
  for(let j=0;j<=ROWS;j++){x.beginPath();x.moveTo(0,j*T+.5);x.lineTo(W,j*T+.5);x.stroke();}
  m.rows.forEach((row,r)=>{[...row].forEach((ch,col)=>{
    const px=col*T,py=r*T;
    if(ch==='#'){x.fillStyle='#7fb3e0';x.fillRect(px,py,T,T);x.strokeStyle='#3c6ea0';x.strokeRect(px+.5,py+.5,T-1,T-1);}
    else if(ch==='P'){x.fillStyle='#9fef22';x.beginPath();x.arc(px+T/2,py+T/2,T*.34,0,Math.PI*2);x.fill();}
    else if(ch==='S'){x.fillStyle='#ff4d4d';x.beginPath();x.arc(px+T/2,py+T/2,T*.28,0,Math.PI*2);x.fill();}
    else if(ch==='W'){x.fillStyle='#ffb454';x.fillRect(px+T*.28,py+T*.28,T*.44,T*.44);}
  });});
});
</script></body></html>
